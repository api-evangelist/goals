name: Goals
description: 'Goals (playgoals.com, formerly goals.co) is a free-to-play competitive
  football (soccer) video game studio backed by Northzone. It positions itself as a
  gameplay-first football game — "No scripts, no excuses, just football" — with fast,
  skill-based competitive matches, unique player squads, card-pack collection, ranked
  leaderboards, and multiple game modes across Steam, Xbox, PlayStation, and the Epic
  Games Store. A companion app lets players manage squads and open packs. This profile
  was surfaced as a Northzone portfolio company (consumer sector) and added to the
  API Evangelist network; the studio publishes a consumer game and a community
  surface (Discord, guides, leaderboards) but no public developer API.'
